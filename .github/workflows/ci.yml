# Lint, types and unit tests on every push to main and every pull request, on each Python the SDK supports, and on
# the oldest dependencies pyproject.toml allows. The release workflow runs it before it publishes. The tests never
# call an API: payfurl/platform runs the integration tests (`just e2e`).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # `test`: the check main's branch protection requires. It passes only when every job below passed.
  test:
    runs-on: ubuntu-latest
    needs: python
    if: always()
    steps:
      - run: test "${{ needs.python.result }}" = success

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
        resolution: [locked]
        include:
          - python: '3.11'
            resolution: lowest-direct
    name: Python ${{ matrix.python }} (${{ matrix.resolution }})
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          if [ "${{ matrix.resolution }}" = locked ]; then
            uv sync --locked
          else
            uv sync --resolution lowest-direct
          fi

      - name: Lint
        run: uv run --no-sync ruff check . && uv run --no-sync ruff format --check .

      - name: Types
        run: uv run --no-sync mypy

      - name: Unit tests
        run: uv run --no-sync pytest

      - name: Build
        run: uv build
