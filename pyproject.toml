[project]
name = "payfurl"
# The one place the version is set: the release tag must be v + this, and the User-Agent sends it.
version = "1.0.0"
description = "payFURL's Python SDK: the payFURL payments API, typed"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "payFURL", email = "support@payfurl.com" }]
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.11,<3"]
keywords = ["payfurl", "payments", "payment orchestration", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://payfurl.com"
Documentation = "https://docs.payfurl.com"
Source = "https://github.com/payfurl/pythonsdk"
Changelog = "https://github.com/payfurl/pythonsdk/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["mypy>=1.18", "pytest>=8", "respx>=0.22", "ruff>=0.14"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
